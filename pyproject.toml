[project]
name = "mtah27"
version = "0.1.0"
description = "More than a Hack 2027 — Fase 1: posse de bola frame a frame"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
    "kloppy==3.18.0", # versão que lê o export EPTS da Metrica (pinada pelo repo oficial)
    "matplotlib>=3.8",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4",
    "ipykernel>=6",
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtah27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = ["external", "docs/official", "src/mtah27/jepa"]  # jepa: cópia do fc-jepa, como veio

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
