# Configuração padrão do pipeline. Toda execução registrada em experiments/log.csv
# aponta para o arquivo de config usado.
#
# Regra: nenhum parâmetro pode estar amarrado a frames específicos do jogo
# (ver RULES.md oficial: "rules and constants tied to specific frames").

team_name: "SALab UFMG"    # exatamente como na inscrição; o CSV sai como SALab_UFMG.csv
game: BAR-ATH
source: tactical           # a submissão é indexada pelo vídeo tático

output:
  dir: outputs/submissions

# Caminho C0: HMM H/A/D sobre "time mais próximo da bola". Valores por prior de futebol, NÃO
# ajustados nos 5 min públicos; serão calibrados na validação externa (Metrica sample).
c0:
  min_duration_s: {H: 1.0, A: 1.0, D: 2.0}
  switch_prob: 0.001          # por frame, saindo do último subestado
  emission:                   # P(observação | estado); cada linha soma 1
    H: {near_home: 0.55, near_away: 0.15, missing: 0.30}
    A: {near_home: 0.15, near_away: 0.55, missing: 0.30}
    D: {near_home: 0.15, near_away: 0.15, missing: 0.70}
