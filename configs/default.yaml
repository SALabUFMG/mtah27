# Configuração padrão do pipeline. Toda execução registrada em experiments/log.csv
# aponta para o arquivo de config usado.
#
# Regra: nenhum parâmetro pode estar amarrado a frames específicos do jogo
# (ver RULES.md oficial: "rules and constants tied to specific frames").

team_name: "SALab UFMG"    # exatamente como na inscrição; o CSV sai como SALab_UFMG.csv
game: BAR-ATH
source: tactical           # a submissão é indexada pelo vídeo tático

output:
  dir: outputs/submissions

# Caminho C0: HMM H/A/D sobre a observação por frame (ver observe.py). Parâmetros ajustados nos
# jogos externos da Metrica (leave-one-game-out), NUNCA nos 5 min públicos.
c0:
  fitted: c0_fitted.yaml     # gerado por scripts/calibrate_c0.py
  degrade:                   # simula a bola ausente do alvo nos jogos externos
    missing_rate: 0.41       # estatística publicada no DATA.md (frames avaliados)
    mean_gap_s: 2.0          # prior, chute: a forma das lacunas do alvo é desconhecida
    seed: 0
  speed:                     # velocidade mediana dos jogadores: sinal de bola morta sem depender da bola
    window_s: 1.0
    bins_ms: [1.0, 1.5]      # cortes vistos nos jogos externos (D ~0,9 m/s; vivo ~1,7 m/s de mediana)
  grid:
    r_close_m: [1, 2]
    min_dur_s: [2, 4, 6, 8]  # H e A usam o valor; D usa o dobro
